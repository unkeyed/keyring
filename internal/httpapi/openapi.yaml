      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries keyring_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor:
    get:
      tags: [auth]
      operationId: getSecondFactor
      summary: The second factors the pending login (keyring_pending cookie) accepts.
      security: []
      responses:
        "200":
          description: The pending login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/code:
    post:
      tags: [auth]
      operationId: secondFactorCode
      summary: Complete the pending login with an authenticator code or a recovery code. A wrong code leaves it pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries keyring_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/passkey/begin:
    post:
      tags: [auth]
      operationId: beginSecondFactorPasskey
      summary: Start completing the pending login with a passkey.
      security: []
      responses:
        "200":
          description: The handle and the options for navigator.credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/second-factor/passkey/finish:
    post:
      tags: [auth]
      operationId: finishSecondFactorPasskey
      summary: Complete the pending login with a passkey.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries keyring_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oauth/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github, oidc]
      - name: intent
        in: query
        description: login (default), link or reauth (signed in), setup or invite (with token).
        schema:
          type: string
          enum: [login, link, reauth, setup, invite]
      - name: token
        in: query
        description: The setup or invite token.
        schema:
          type: string
      - name: next
        in: query
        description: Where to land after signing in. Same-origin paths only.
        schema:
          type: string
    get:
      tags: [auth]
      operationId: startOAuth
      summary: Redirect to the provider. Sets keyring_oauth, which binds the flow to this browser.
      security: []
      responses:
        "303":
          description: To the provider, or back to the page with ?error= when the flow cannot start.
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oauth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github, oidc]
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: The redirect URI to register at the provider. Completes the flow and redirects into the app.
      description: Social sign-in never creates an account for a stranger. It signs in a user whose email matches the provider-verified email, accepts a live invite for it, or joins an ALLOWED_EMAIL_DOMAINS address; anything else is refused.
      security: []
      responses:
        "303":
          description: Into the app, to /login?second_factor=1 when a code is due, or back with ?error=.
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/setup/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [auth]
      operationId: checkSetup
      summary: Whether a setup or recovery link still works. Setup links exist only while nobody can sign in; recovery links come from `keyring recover` and last an hour.
      security: []
      responses:
        "200":
          description: It works.
          content:
            application/json:
              schema:
                type: object
                required: [recovery]
                properties:
                  recovery:
                    type: boolean
                    description: True for a recovery link, which adds a passkey to the existing account with the email it was issued for.
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [auth]
      operationId: getInvite
      summary: The email a live invite is for.
      security: []
      responses:
        "200":
          description: The invite.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/signup/passkey/begin:
    post:
      tags: [auth]
      operationId: beginPasskeySignup
      summary: Start registering the first passkey of a new account, through a setup link (email and name) or an invite (name).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                setup_token:
                  type: string
                invite_token:
                  type: string
                email:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: The handle and the options for navigator.credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/signup/passkey/finish:
    post:
      tags: [auth]
      operationId: finishPasskeySignup
      summary: Create the account with its passkey and sign in. Uses up the setup link or invite.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "200":
          description: Signed in (Set-Cookie carries the session), or a second factor is due (Set-Cookie carries keyring_pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session and clear the cookie. Succeeds without a session too.
      security: []
      responses:
        "204":
          description: Logged out.
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key from Settings > API keys, such as `keyring_ab12...`.
    session:
      type: apiKey
      in: cookie
      name: keyring_session
      description: Set by a completed sign-in under /auth. Unsafe cross-site browser requests are rejected.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Page size, default 50, at most 200.
      schema:
        type: integer
        minimum: 0
        maximum: 200
  responses:
    BadRequest:
      description: The request is malformed. The message says which field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credentials, or a bad API key, session or password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: This route needs a signed-in person; API keys cannot use it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such contact, company, note, key or provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: That email already has an account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Exists:
      description: The email or domain is already in Keyring; id names that contact or company.
      content:
        application/json:
          schema:
            type: object
            required: [error, id]
            properties:
              error:
                type: string
              id:
                type: integer
    Reauth:
      description: >-
        This change (how you sign in, API keys, providers or the team) needs a
        sign-in within the last 15 minutes (code reauth_required). Confirm with
        POST /v1/account/reauth/*, or the reauth OAuth intent, and retry. Also
        403 for API keys, as Forbidden.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [reauth_required]
    TooManyRequests:
      description: Too many failed attempts for this email, account or IP. Wait Retry-After seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The database or the key store (Postgres or Unkey) could not answer. Retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string
          description: Present on 5xx; the server log carries the same id.
    JobState:
      type: string
      enum: [pending, running, done, failed, skipped]
    ContactField:
      type: string
      enum: [name, title, location, bio, linkedin_url, company]
    CompanyField:
      type: string
      enum: [name, description, employee_range, industry, country, linkedin_url, tagline, headquarters]
    ActivityKind:
      type: string
      enum: [signed_up, provider_deleted, contact_updated, company_updated, note_added, note_deleted, contacts_merged, contact_created, company_created, enriched]
    Actor:
      type: object
      description: Who caused a write.
      required: [kind, id, label]
      properties:
        kind:
          type: string
          enum: [user, api_key, app, provider, system]
          description: app is an MCP client acting for the person who approved it; its id is the connection and its label reads "Claude Code (via Alex Rivera)".
        id:
          type: string
        label:
          type: string
    CompanyRef:
      type: object
      required: [id, domain, name]
      properties:
        id:
          type: integer
        domain:
          type: string
        name:
          type: string
          description: Empty until enriched or edited; show domain then.
    ContactRef:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
    Contact:
      type: object
      required: [id, email, name, avatar_url, title, location, bio, linkedin_url, socials, company, stage, tags, providers, enrichment, manual_fields, first_seen_at, last_seen_at, created_at, updated_at]
      properties:
        id:
          type: integer
        email:
          type: string
          description: Normalized (lowercased) email. One contact per email.
        name:
          type: string
        avatar_url:
          type: string
        title:
          type: string
        location:
          type: string
        bio:
          type: string
        linkedin_url:
          type: string
        socials:
          $ref: "#/components/schemas/Socials"
        company:
          description: Null for free-mail addresses and unknown companies.
          oneOf:
            - $ref: "#/components/schemas/CompanyRef"
            - type: "null"
        stage:
          type: string
        tags:
          type: array
          items:
            type: string
        providers:
          type: array
          description: Auth providers this person signed up through.
          items:
            type: string
        enrichment:
          description: Empty string when no enrichment job exists.
          anyOf:
            - $ref: "#/components/schemas/JobState"
            - const: ""
        manual_fields:
          type: array
          description: Pinned fields that sign-ups and enrichment leave alone.
          items:
            $ref: "#/components/schemas/ContactField"
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Identity:
      type: object
      description: One auth provider's latest view of the person.
      required: [provider, external_id, email, email_verified, name, avatar_url, occurred_at]
      properties:
        provider:
          type: string
        external_id:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        name:
          type: string
        avatar_url:
          type: string
        occurred_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    Note:
      type: object
      required: [id, contact_id, body, author, created_at]
      properties:
        id:
          type: integer
        contact_id:
          type: integer
        body:
          type: string
          description: Markdown.
        author:
          $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
    Activity:
      type: object
      required: [id, kind, actor, data, occurred_at]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/ActivityKind"
        contact:
          $ref: "#/components/schemas/ContactRef"
        company:
          $ref: "#/components/schemas/CompanyRef"
        actor:
          $ref: "#/components/schemas/Actor"
        data:
          type: object
          description: |
            Depends on kind. signed_up {provider, external_id};
            provider_deleted {provider, external_id}; contact_updated and
            company_updated {field: {from, to}} or {reset: field}, with tag
            edits under tags as {added, removed}; note_added and note_deleted
            {note_id}; contacts_merged {drop_id, drop_email}; contact_created
            and company_created {}; enriched {changed: [field]}.
        occurred_at:
          type: string
          format: date-time
    ContactDetail:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          required: [identities, notes, activity]
          properties:
            identities:
              type: array
              items:
                $ref: "#/components/schemas/Identity"
            notes:
              type: array
              description: Newest first.
              items:
                $ref: "#/components/schemas/Note"
            activity:
              type: array
              description: Newest first, at most 50.
              items:
                $ref: "#/components/schemas/Activity"
    Company:
      type: object
      required: [id, domain, name, description, logo_url, employee_range, industry, country, linkedin_url, tagline, headquarters, socials, links, segments, stock, logos, stage, contact_count, enrichment, manual_fields, created_at, updated_at]
      properties:
        id:
          type: integer
        domain:
          type: string
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
          description: The first of logos, for clients that show one image.
        employee_range:
          type: string
        industry:
          type: string
        country:
          type: string
        linkedin_url:
          type: string
        tagline:
          type: string
        headquarters:
          type: string
          description: City and region, such as "South San Francisco, California". The country is in country.
        socials:
          $ref: "#/components/schemas/Socials"
        links:
          type: object
          description: The company's own pages by kind.
          properties:
            careers:
              type: string
            pricing:
              type: string
            blog:
              type: string
            contact:
              type: string
        segments:
          type: array
          description: Sub-industries, most relevant first.
          items:
            type: string
        stock:
          type: string
          description: 'Exchange and ticker, such as "NASDAQ: XYZ", or empty.'
        logos:
          type: array
          description: >-
            Every logo, best first. Icons come before wordmarks; within each,
            images with their own background, then art that reads on both
            light and dark backgrounds; then sharp before blurry; then the
            squarest.
          items:
            $ref: "#/components/schemas/Logo"
        stage:
          description: >-
            The company's pipeline stage, or null until someone sets it. New
            contacts at the company start in it.
          type: [string, "null"]
        contact_count:
          type: integer
        enrichment:
          anyOf:
            - $ref: "#/components/schemas/JobState"
            - const: ""
        manual_fields:
          type: array
          items:
            $ref: "#/components/schemas/CompanyField"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Socials:
      type: object
      description: Profile type (x, github, youtube, website, or a host name) to URL. LinkedIn is in linkedin_url.
      additionalProperties:
        type: string
    Logo:
      type: object
      required: [url, kind, own_background, on_light, on_dark, aspect, width]
      properties:
        url:
          type: string
        kind:
          type: string
          enum: [icon, wordmark]
        own_background:
          type: boolean
          description: The image is opaque and fills its own box.
        on_light:
          type: boolean
          description: The art reads on a light background.
        on_dark:
          type: boolean
          description: The art reads on a dark background.
        aspect:
          type: number
          description: Width over height, 0 when unknown.
        width:
          type: integer
          description: Pixels, 0 when unknown.
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [contacts, activity]
          properties:
            contacts:
              type: array
              description: Every contact, newest sign-up first.
              items:
                $ref: "#/components/schemas/Contact"
            activity:
              type: array
              description: The company's and its contacts' entries, newest first, at most 50.
              items:
                $ref: "#/components/schemas/Activity"
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
          description: Absent on the last page.
    CompanyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        next_cursor:
          type: string
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        next_cursor:
          type: string
          description: Absent on the last page.
    StageCount:
      type: object
      required: [name, contact_count, company_count]
      properties:
        name:
          type: string
        contact_count:
          type: integer
        company_count:
          type: integer
    BulkUpdate:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
        stage:
          type: string
          description: One of GET /v1/stages.
        add_tags:
          type: array
          items:
            type: string
        remove_tags:
          type: array
          items:
            type: string
    BulkResult:
      type: object
      required: [id, ok]
      properties:
        id:
          type: integer
        ok:
          type: boolean
        error:
          type: string
          description: Why this contact was not changed, such as "no contact 999". Present when ok is false.
    TimeOrDate:
      type: string
      description: An RFC 3339 time, or a date such as 2026-01-02 meaning midnight UTC.
      anyOf:
        - format: date-time
        - format: date
    WebURL:
      type: string
      description: An http or https URL; https:// is added when the scheme is missing, and an empty string clears the field.
    ContactPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        location:
          type: string
        bio:
          type: string
        linkedin_url:
          $ref: "#/components/schemas/WebURL"
        stage:
          type: string
          description: One of GET /v1/stages.
        company_domain:
          type: string
          description: Move the contact to this company domain. An empty string detaches it.
        add_tags:
          type: array
          items:
            type: string
        remove_tags:
          type: array
          items:
            type: string
    CompanyPatch:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          description: >-
            One of GET /v1/stages. Moves every contact at the company to it.
            An empty string clears the company's stage.
        name:
          type: string
        description:
          type: string
        employee_range:
          type: string
        industry:
          type: string
        country:
          type: string
        linkedin_url:
          $ref: "#/components/schemas/WebURL"
        tagline:
          type: string
        headquarters:
          type: string
    NewContact:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
        title:
          type: string
        location:
          type: string
        linkedin_url:
          $ref: "#/components/schemas/WebURL"
        stage:
          type: string
          description: One of GET /v1/stages. Defaults to the first.
        tags:
          type: array
          items:
            type: string
    NewCompany:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain:
          type: string
        name:
          type: string
    SignupBody:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          $ref: "#/components/schemas/WebURL"
        email_verified:
          type: boolean
        source:
          type: string
          description: Your system's name. Defaults to "api". Built-in provider names are rejected.
        external_id:
          type: string
          description: Your system's user id. Defaults to the normalized email.
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now.
    IngestResult:
      type: object
      required: [contact_id, created, duplicate]
      properties:
        contact_id:
          type: integer
        created:
          type: boolean
          description: True when this call created the contact.
        duplicate:
          type: boolean
          description: True when this sign-up was already recorded.
    EnrichResult:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/JobState"
    ProviderStatus:
      type: object
      required: [name, title, webhook_path, issue_secret, setup, connected]
      properties:
        name:
          type: string
        title:
          type: string
        webhook_path:
          type: string
          description: Such as /webhooks/clerk. Prefix it with this server's origin.
        issue_secret:
          type: boolean
          description: True when Keyring generates the secret; false when you paste the provider's.
        setup:
          type: string
          description: Markdown setup steps with {{webhook_url}} and {{secret}} placeholders.
        connected:
          type: boolean
        last_delivery_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_error_at:
          type: string
          format: date-time
    Status:
      type: object
      required: [enrichment_enabled, jobs, contacts, companies, key_store]
      properties:
        enrichment_enabled:
          type: boolean
          description: False when CONTEXT_DEV_API_KEY is unset; jobs then wait as pending.
        enrichment_halt:
          type: object
          description: Present while context.dev rejected the key or account and enrichment is paused.
          required: [reason, until]
          properties:
            reason:
              type: string
            until:
              type: string
              format: date-time
        jobs:
          type: object
          description: Enrichment job count per state, every state present.
          additionalProperties:
            type: integer
        enrichment_daily_limit:
          type: integer
          description: ENRICHMENT_DAILY_LIMIT, the most context.dev calls per UTC day. 0 means no limit.
        enrichment_calls_today:
          type: integer
          description: Calls made since midnight UTC. Once it reaches the limit, jobs wait until the next day.
        contacts:
          type: integer
        companies:
          type: integer
        key_store:
          type: string
          enum: [builtin, unkey]
    Key:
      type: object
      required: [id, name, prefix, read_only, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, such as keyring_ab12, to tell keys apart.
        read_only:
          type: boolean
          description: The key can only call GET routes.
        expires_at:
          type: string
          format: date-time
          description: When the key stops working. Absent for a key that works until revoked. Expired keys stay listed until revoked.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    App:
      type: object
      description: An MCP client a person approved. Anyone can register an app under any name, so the name is the app's own claim.
      required: [id, name, approved_by, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        approved_by:
          type: string
          description: The name, or else the email, of the person it acts as.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    ConsentRequest:
      type: object
      required: [client_name, redirect_uri, client_registered_at]
      properties:
        client_name:
          type: string
          description: The name the app registered itself with. Unverified.
        redirect_uri:
          type: string
          description: Where the code goes if the person approves.
        client_registered_at:
          type: string
          format: date-time
    CreatedKey:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The plaintext key. Shown only in this response.
    SignInResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_in, second_factor]
        second_factors:
          type: array
          description: With second_factor, what the pending login accepts.
          items:
            type: string
            enum: [totp, recovery_code, passkey]
    CeremonyStart:
      type: object
      required: [handle, options]
      properties:
        handle:
          type: string
          description: Send back with the credential.
        options:
          type: object
          description: "{publicKey: ...} for navigator.credentials.get or .create, with binary fields as base64url."
    CeremonyFinish:
      type: object
      required: [handle, credential]
      additionalProperties: false
      properties:
        handle:
          type: string
        credential:
          type: object
          description: The PublicKeyCredential as JSON, binary fields base64url.
        name:
          type: string
          description: A name for a new passkey.
    AuthOptions:
      type: object
      required: [providers, password_login, setup_required]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, name, callback_url]
            properties:
              id:
                type: string
                enum: [google, github, oidc]
              name:
                type: string
              callback_url:
                type: string
                description: The redirect URI to register at the provider.
        password_login:
          type: boolean
        setup_required:
          type: boolean
          description: True while nobody can sign in. The server logs a setup link at start.
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    LinkedIdentity:
      type: object
      required: [provider, email, created_at, last_used_at]
      properties:
        provider:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    Session:
      type: object
      required: [id, method, user_agent, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
        method:
          type: string
          description: The factors that opened it, joined with +, e.g. password+totp or github.
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    Account:
      type: object
      required: [user, passkeys, identities, totp, recovery_codes_left, password, recent, sessions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/LinkedIdentity"
        totp:
          type: boolean
        recovery_codes_left:
          type: integer
        password:
          type: boolean
        recent:
          type: boolean
          description: Whether this session signed in within 15 minutes and may change sign-in methods.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    TOTPEnrolment:
      type: object
      required: [handle, secret, uri, qr]
      properties:
        handle:
          type: string
        secret:
          type: string
          description: Base32, for typing into an app by hand.
        uri:
          type: string
          description: The otpauth:// URI.
        qr:
          type: string
          description: The URI as a PNG data URL.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
