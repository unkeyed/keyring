      tags: [settings]
      operationId: connectProvider
      summary: Store the webhook signing secret for a provider, replacing any previous one.
      description: Paste the provider's secret, or send an empty secret for providers with issue_secret to have Keyring generate one. The response holds the secret once.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                secret:
                  type: string
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [settings]
      operationId: disconnectProvider
      summary: Forget the provider's secret. Its contacts stay; new deliveries get 404.
      security:
        - session: []
      responses:
        "204":
          description: Disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
