openapi: 3.1.0
info:
  title: Keyring
  version: 0.1.0
  summary: The REST API of a self-hosted CRM that collects every sign-up from your auth providers.
  description: |
    The React UI and your agents call the same routes. Agents send an API key
    (`Authorization: Bearer keyring_...`, created under Settings > API keys).
    People send the `keyring_session` cookie that a sign-in under `/auth` sets.
    Routes for keys, providers, stages and the team accept only the cookie, so
    a leaked agent key cannot mint more access.

    Every error is `{"error": "<message>"}` with a status that says what to do:
    400 fix the request (an unknown stage, field or activity kind lists the
    valid ones), 401 bad or missing credentials, 403 this route needs a
    signed-in person, 404 no such thing, 405 wrong method for this path (the
    `Allow` header lists the right ones), 409 it already exists (`id` names
    it), 429 wait for `Retry-After` seconds, 503 the database or key store is
    down so retry later. A 5xx also carries `request_id`, which the server log
    repeats.

    Lists are never null: an empty list is `[]`. Timestamps are RFC 3339; time
    filters in query strings also take a date such as `2026-01-02` (midnight
    UTC). Unknown query parameters and unknown body fields are rejected with
    400. Stored URLs (`linkedin_url`, `avatar_url`) must be http or https; a
    missing scheme gets `https://`, anything else is 400.

    Write rule: a field a person or agent sets is pinned. It is listed in
    `manual_fields`, and sign-ups and enrichment leave it alone until someone
    resets it with `DELETE .../manual_fields/{field}`.

    Every operation an API key can call is also an MCP tool at `/mcp`
    (Streamable HTTP), except POST /v1/signups, which is for auth systems;
    docs/agents.md maps them. `/mcp` does not take API keys: an MCP client
    signs in with OAuth 2.1 as a person, who approves it in the browser.
    The OAuth endpoints are described by `/.well-known/oauth-authorization-server`
    and `/.well-known/oauth-protected-resource/mcp`, not here.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The Keyring instance serving this document.
security:
  - apiKey: []
  - session: []
tags:
  - name: contacts
    description: People, one per email, merged across auth providers.
  - name: companies
    description: One per business email domain. Free-mail addresses get none.
  - name: timeline
    description: Activity, tags and stages.
  - name: settings
    description: Session only. Agents get 403.
  - name: auth
    description: Sign-in for people. Agents use API keys instead.
  - name: account
    description: How the signed-in person signs in. Session only.
  - name: system
    description: Health, this document and provider webhooks.
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness check. 200 when the process is up; does not touch the database.
      security: []
      responses:
        "200":
          description: The process is up.
  /v1/openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenAPI
      summary: This document.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 description of every route.
          content:
            application/yaml:
              schema:
                type: string
  /webhooks/{provider}:
    post:
      tags: [system]
      operationId: receiveWebhook
      summary: Receive a sign-up webhook from an auth provider.
      description: |
        Point the provider's webhook at this URL after connecting it with
        `PUT /v1/providers/{name}`. The signature is checked with the stored
        secret. Retries and replays of the same user land once. A verified
        delivery that carries nothing to store (an event Keyring ignores, a
        phone-only user) still answers 204 so the provider stops retrying.
        The outcome shows on the Settings page as last delivery or last error.

        Every delivery that fails verification gets the same 401, including
        one for an unknown provider or one not connected yet, so the answer
        does not reveal which providers are connected. An address whose
        deliveries keep failing gets 429 until it backs off.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Registered provider name.
          schema:
            type: string
            enum: [auth0, better-auth, clerk, stytch, supabase, workos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The provider's own event payload.
      responses:
        "204":
          description: Stored, or verified and ignored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The delivery did not verify, the provider is not connected, or there is no such provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/signups:
    post:
      tags: [contacts]
      operationId: createSignup
      summary: Record a sign-up from any auth system that has no built-in adapter.
      description: |
        Only `email` is required. The call is idempotent on (`source`,
        `external_id`), which default to `api` and the normalized email, so
        posting the same person twice records one sign-up: 201 the first
        time, 200 with `duplicate: true` after. `source` may not be a built-in
        provider name; connect that provider instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
      responses:
        "201":
          description: A new contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "200":
          description: An existing contact; `duplicate` says whether this sign-up was already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/contacts:
    get:
      tags: [contacts]
      operationId: searchContacts
      summary: List and search contacts, newest first.
      description: Every filter is optional and they combine with AND. Page with `cursor` from the previous `next_cursor`.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of email, name, company name or company domain.
          schema:
            type: string
        - name: email
          in: query
          description: >-
            Exact email, case-insensitive. Matches the contact's email and every
            email its sign-ups used, so a page holds at most a few contacts.
          schema:
            type: string
            format: email
        - name: tag
          in: query
          schema:
            type: string
        - name: stage
          in: query
          description: Exact stage name. An unknown one is 400 listing the stages.
          schema:
            type: string
        - name: provider
          in: query
          description: Auth provider name, such as `clerk`, or `api` for POST /v1/signups.
          schema:
            type: string
        - name: company_id
          in: query
          schema:
            type: integer
        - name: signed_up_after
          in: query
          description: First seen at or after this time.
          schema:
            $ref: "#/components/schemas/TimeOrDate"
        - name: signed_up_before
          in: query
          description: First seen before this time.
          schema:
            $ref: "#/components/schemas/TimeOrDate"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: One page of contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [contacts]
      operationId: createContact
      summary: Add a contact by hand.
      description: >-
        For a person who never signed up through an auth provider. The company
        comes from the email domain (none for free mail), and the contact and a
        new company are queued for enrichment. Every field you send is pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewContact"
      responses:
        "201":
          description: The new contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Exists"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [contacts]
      operationId: getContact
      summary: One contact with its identities, notes and the newest 50 timeline entries.
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Edit a contact's fields, stage, company or tags.
      description: |
        Omitted fields are left alone. Each field you send is pinned (added to
        `manual_fields`). Tags are add and remove sets, so two agents tagging
        at once both win. An unknown stage is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPatch"
      responses:
        "200":
          description: The contact after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [contacts]
      operationId: deleteContact
      summary: Erase a contact with its identities, tags, notes and timeline.
      description: >-
        For data deletion requests. Cannot be undone, and nothing records it.
        If the person signs up again they come back as a new contact.
      responses:
        "204":
          description: Erased.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/bulk:
    post:
      tags: [contacts]
      operationId: bulkUpdateContacts
      summary: Set one stage and add or remove tags on up to 200 contacts.
      description: >-
        Each contact is updated on its own, as PATCH would. A missing contact
        fails alone and the rest go ahead, so the status is 200 with one result
        per id. A request with no ids, more than 200, nothing to change, an
        unknown stage or a blank tag is 400 and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdate"
      responses:
        "200":
          description: One result per id, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/{id}/manual_fields/{field}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: field
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ContactField"
    delete:
      tags: [contacts]
      operationId: resetContactField
      summary: Unpin a field so the next sign-up or enrichment can set it again.
      description: The current value stays until a machine observes a new one. Unpinning a field that is not pinned is a no-op.
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [contacts]
      operationId: mergeContacts
      summary: Fold another contact (drop) into this one (keep). Use when one person signed up with two emails.
      description: Moves drop's identities, notes, tags and history to keep, fills keep's empty fields from drop, then deletes drop. Cannot be undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drop]
              additionalProperties: false
              properties:
                drop:
                  type: integer
                  description: The contact to fold in and delete.
      responses:
        "200":
          description: The surviving contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [contacts]
      operationId: addNote
      summary: Add a Markdown note to a contact's timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body:
                  type: string
                  description: Markdown. Must not be blank.
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [contacts]
      operationId: deleteNote
      summary: Delete a note. Its note_added entry stays, and a note_deleted entry records who deleted it.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/contacts/{id}/enrich:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [contacts]
      operationId: enrichContact
      summary: Queue a fresh context.dev lookup for a contact and its company.
      description: Runs in the background. Without CONTEXT_DEV_API_KEY the job waits as pending. Free-mail contacts are skipped.
      responses:
        "200":
          description: Nothing to do (state skipped, such as a free-mail contact); no job will run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichResult"
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/companies:
    get:
      tags: [companies]
      operationId: searchCompanies
      summary: List and search companies, newest first.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the company name or domain.
          schema:
            type: string
        - name: domain
          in: query
          description: Exact domain, case-insensitive, such as stripe.com.
          schema:
            type: string
        - name: stage
          in: query
          description: Exact stage name. An unknown one is 400 listing the stages.
          schema:
            type: string
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: One page of companies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [companies]
      operationId: createCompany
      summary: Add a company by domain and queue its enrichment.
      description: A free-mail domain such as gmail.com is a 400. A name you send is pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCompany"
      responses:
        "201":
          description: The new company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Exists"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [companies]
      operationId: getCompany
      summary: One company with every contact and the newest 50 timeline entries of the company and its contacts.
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [companies]
      operationId: updateCompany
      summary: Edit a company's fields or stage. Each field you send is pinned.
      description: >-
        Setting stage moves every contact at the company to that stage, and
        contacts created at the company later start in it. Sending it again
        moves anyone who has left it since. An empty string clears the
        company's stage and leaves its contacts where they are. An unknown
        stage is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatch"
      responses:
        "200":
          description: The company after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [companies]
      operationId: deleteCompany
      summary: Delete a company and its timeline. Its contacts stay, unlinked.
      description: >-
        Cannot be undone. Each unlinked contact gets a contact_updated entry,
        and its company field is pinned so the next sign-up does not re-create
        the company; DELETE /v1/contacts/{id}/manual_fields/company relinks one.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/companies/{id}/manual_fields/{field}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: field
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CompanyField"
    delete:
      tags: [companies]
      operationId: resetCompanyField
      summary: Unpin a company field so enrichment can set it again.
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/companies/{id}/enrich:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [companies]
      operationId: enrichCompany
      summary: Queue a fresh context.dev lookup for a company.
      responses:
        "200":
          description: Nothing to do (state skipped, such as a free-mail contact); no job will run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichResult"
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/activity:
    get:
      tags: [timeline]
      operationId: listActivity
      summary: The timeline, newest first. Use kind=signed_up for recent sign-ups.
      description: Filters combine with AND. Page with `cursor` from the previous `next_cursor`. An unknown kind is 400 listing the kinds.
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ActivityKind"
        - name: contact_id
          in: query
          schema:
            type: integer
        - name: company_id
          in: query
          description: The company's own entries and its contacts'.
          schema:
            type: integer
        - name: since
          in: query
          description: At or after this time.
          schema:
            $ref: "#/components/schemas/TimeOrDate"
        - name: before
          in: query
          description: Before this time.
          schema:
            $ref: "#/components/schemas/TimeOrDate"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: One page of timeline entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tags:
    get:
      tags: [timeline]
      operationId: listTags
      summary: Every tag in use, with how many contacts carry it.
      responses:
        "200":
          description: Tag to contact count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/stages:
    get:
      tags: [timeline]
      operationId: listStages
      summary: The pipeline stages in order. New contacts start in the first.
      description: GET /v1/stages/counts adds each stage's contact count.
      responses:
        "200":
          description: Stage names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [settings]
      operationId: setStages
      summary: Replace the ordered stage list.
      description: renames maps an old name to a new one so contacts and companies follow. Removing a stage that contacts or companies still use is 400.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stages]
              additionalProperties: false
              properties:
                stages:
                  type: array
                  minItems: 1
                  items:
                    type: string
                renames:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/stages/counts:
