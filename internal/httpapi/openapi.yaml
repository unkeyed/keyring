      summary: Active API keys, newest first. Plaintext is never shown again.
      security:
        - session: []
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [settings]
      operationId: createKey
      summary: Create an API key for an agent or a backend. The response is the only time the key is shown.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: A label people recognize, such as "Claude Code".
                read_only:
                  type: boolean
                  default: false
                  description: Limit the key to GET routes. It can read contacts, companies and activity but not change, delete or enrich anything.
                expires_at:
                  type: string
                  format: date-time
                  description: When the key stops working, at most two years ahead. Omit for a key that works until revoked.
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Reauth"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [settings]
      operationId: revokeKey
      summary: Revoke a key. It stops working at once (within 30 seconds with Unkey).
      security:
        - session: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/keys/current:
