# Serves the Keyring landing page on Unkey Deploy, which sends traffic and
# health checks to port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects such as /docs -> /docs/ stay relative, so they keep the
    # https host Unkey's gateway serves instead of this container's port.
    absolute_redirect off;

    # Sets $analytics_script_src and $analytics_connect_src, and adds the
    # Databuddy tag when DATABUDDY_CLIENT_ID is set. See analytics.sh.
    include /etc/nginx/analytics.conf;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' $analytics_script_src; connect-src 'self' $analytics_connect_src; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: $analytics_connect_src; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # expires sets Cache-Control without add_header, which would drop the
    # server-level headers above for this location.
    location / {
        index index.html;
        expires -1;
        # /docs/sign-in serves docs/sign-in.html.
        try_files $uri $uri.html $uri/ =404;
    }
}
