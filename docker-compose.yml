services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: uncrm
      POSTGRES_PASSWORD: uncrm
      POSTGRES_DB: uncrm
    ports:
      - "${UNCRM_DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uncrm -d uncrm"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://uncrm:uncrm@db:5432/uncrm?sslmode=disable
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: uncrm-dev-password
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
    ports:
      - "${UNCRM_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
