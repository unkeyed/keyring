name: keyring

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: keyring
      POSTGRES_PASSWORD: keyring
      POSTGRES_DB: keyring
    ports:
      - "127.0.0.1:${KEYRING_DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyring -d keyring"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://keyring:keyring@db:5432/keyring?sslmode=disable
      # Encrypts webhook secrets and TOTP seeds. Put ENCRYPTION_KEY=<openssl rand -base64 32> in .env and keep it:
      # without it, stored secrets cannot be read.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENRICHMENT_DAILY_LIMIT: ${ENRICHMENT_DAILY_LIMIT:-200}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${KEYRING_PORT:-8080}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-false}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
    ports:
      - "127.0.0.1:${KEYRING_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
